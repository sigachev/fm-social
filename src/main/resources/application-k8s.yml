server:
  port: 80

spring:
  datasource:
    url: jdbc:postgresql://postgres.dev.svc.cluster.local:5432/social
    username: user
    password: Int6859351!
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: redis.dev.svc.cluster.local
      port: 6379
      # REPLACE_AT_BUILD — set to the value in K8s Secret redis-auth, key: password
      password: REPLACE_AT_BUILD
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://auth.finmates.com/realms/finmates/protocol/openid-connect/certs
          issuer-uri: https://auth.finmates.com/realms/finmates

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

finmates:
  services:
    main-url: http://main
    crypto-url: http://crypto
  internal:
    shared-secret: ${INTERNAL_SHARED_SECRET}
  feed:
    max-entries-per-user: 1000
    fanout-batch-size: 500
    fanout-cold-threshold: 10000
  edit-window-minutes: 5
  post:
    max-content-length: 1200
    max-media-count: 10
  comment:
    max-content-length: 500
  jwt:
    principal-attribute: preferred_username
    resource-id: finmates-app

logging:
  level:
    com.finmates.social: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
