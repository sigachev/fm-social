spring:
  application:
    name: fm-social
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8091}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.finmates.social: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

fm-social:
  s3:
    bucket: ${S3_BUCKET:finmates-media}
    region: ${AWS_REGION:us-east-1}
    presign-put-ttl-minutes: 15
    presign-get-ttl-minutes: 60
    max-file-size-bytes: 10485760          # 10 MB
    allowed-content-types: image/jpeg,image/png,image/webp,image/gif
    allowed-extensions: jpg,jpeg,png,webp,gif
    max-uploads-per-presign-call: 10
    presign-rate-limit-per-minute: 30
