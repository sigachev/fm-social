spring:
  application:
    name: fm-social
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
    # Without an explicit hikari block, Spring Boot defaults to maximum-pool-size=10 /
    # minimum-idle=10 — every JVM start opens and holds 10 idle connections. On a shared
    # dev/prod Postgres that adds up fast across local stacks. k8s profile overrides this
    # block with its own sizing; this base default is what local-dev runs inherit.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8091}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.finmates.social: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

fm-social:
  redis:
    use-redis: ${FM_SOCIAL_REDIS_USE_REDIS:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://finmates.com,https://www.finmates.com}
  s3:
    bucket: ${S3_BUCKET:finmates-media}
    region: ${AWS_REGION:us-east-1}
    presign-put-ttl-minutes: 15
    presign-get-ttl-minutes: 60
    max-file-size-bytes: 10485760          # 10 MB
    allowed-content-types: image/jpeg,image/png,image/webp,image/gif
    allowed-extensions: jpg,jpeg,png,webp,gif
    max-uploads-per-presign-call: 10
    presign-rate-limit-per-minute: 30
