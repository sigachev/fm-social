server:
  port: 8091

spring:
  datasource:
    url: jdbc:postgresql://finmates.com:5432/social
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:Int6859351!}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://auth.finmates.com/realms/finmates/protocol/openid-connect/certs
          issuer-uri: https://auth.finmates.com/realms/finmates

fm-social:
  redis:
    use-redis: false

finmates:
  services:
    main-url: http://localhost:8081
    crypto-url: http://localhost:8087
  internal:
    shared-secret: ${INTERNAL_SHARED_SECRET:dev-local-secret}
  feed:
    max-entries-per-user: 1000
    fanout-batch-size: 500
    fanout-cold-threshold: 10000
  edit-window-minutes: 5
  post:
    max-content-length: 1200
    max-media-count: 10
  comment:
    max-content-length: 500
  jwt:
    principal-attribute: preferred_username
    resource-id: finmates-app

# SQL visibility for dev. Enables N+1 detection in PR verification workflows —
# every controller PR that touches data access should be eyeballed against the
# Hibernate SQL log before commit. BasicBinder at TRACE prints parameter values
# so you can spot duplicate per-row queries with different bind args.
# See CLAUDE.md → "SQL visibility in dev profile" for rationale.
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
