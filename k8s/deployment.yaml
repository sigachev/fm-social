apiVersion: apps/v1
kind: Deployment
metadata:
  name: social
  namespace: dev
spec:
  replicas: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: social
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: social
    spec:
      containers:
        - name: fm-social
          image: 10.0.0.70:8090/fm-social:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            # azp guard: report-only for the first rollout. Flip to "true" (or delete this entry) once the
            # "azp guard (report-only)" log lines have been reviewed and show no unexpected clients.
            - name: FINMATES_SECURITY_AZP_ENFORCE
              value: "false"
            - name: SERVER_PORT
              value: '80'
            # Browser notifications: optional, push stays off until the fm-webpush secret exists.
            - name: WEBPUSH_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: fm-webpush
                  key: public-key
                  optional: true
            - name: WEBPUSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: fm-webpush
                  key: private-key
                  optional: true
            - name: INTERNAL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: fm-internal-secret
                  key: internal-shared-secret
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: fm-aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: fm-aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: fm-aws-credentials
                  key: AWS_REGION
            - name: S3_BUCKET
              value: finmates-media
            - name: CORS_ALLOWED_ORIGINS
              value: https://finmates.com,https://www.finmates.com
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # ↓↓↓ ADDED: Redis password wiring (mirrors POSTGRES_PASSWORD pattern) ↓↓↓
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            # ↑↑↑ must match the ${SPRING_DATA_REDIS_PASSWORD} in application-k8s.yaml ↑↑↑
          resources:
            limits:
              cpu: '1'
              memory: 1500M
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: k8s-node-1
      securityContext: {}
      imagePullSecrets:
        - name: nexus-registry-secret
      schedulerName: default-scheduler